name: kontur
services:
  app:
    build:
      context: ..
      network: host
    image: kontur:${RELEASE_TAG:-local}
    restart: unless-stopped
    init: true
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 100
    environment:
      PRODUCT_ORIGIN: ${PRODUCT_ORIGIN:?Set the public site origin}
      HACKATHON_ORIGIN: ${HACKATHON_ORIGIN:-http://hackathon.localhost:4317}
    ports:
      - '127.0.0.1:4317:4317'
    volumes:
      - ${KONTUR_DATA_DIR:-/opt/kontur/data}:/var/lib/kontur
    tmpfs:
      - /tmp:size=64m,mode=1777
    # Use the VM subnet DNS, independent of a host VPN's DNS routing.
    dns:
      - ${KONTUR_DNS:-10.130.0.2}
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4317/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  web:
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    user: '101:101'
    entrypoint: [nginx, -g, 'daemon off;']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 32
    ports:
      - '80:8080'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      app:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
